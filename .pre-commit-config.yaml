repos:
  - repo: local
    hooks:
      - id: bash-syntax
        name: Bash syntax check (bash -n)
        entry: bash -n game.sh slash sprites test.sh
        language: system
        pass_filenames: false
      - id: slash-tests
        name: Slash engine & ASCII UI test suite
        entry: ./test.sh
        language: system
        pass_filenames: false
      - id: commit-msg-50-72
        name: Conventional Commits (50/72 rule)
        entry: ./.githooks/commit-msg
        language: system
        stages: [commit-msg]
